name: Fetch AWS News

on:
  schedule:
    # 매일 UTC 09:00 (한국 시간 18:00)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "기존 뉴스 파일 무시하고 전체 재수집"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch & Archive AWS News
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3

      - name: Fetch AWS news
        env:
          SUMMARIZE_WITH_AI: ${{ secrets.AWS_SUMMARIZE_ENABLED || 'false' }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'anthropic.claude-3-haiku-20240307-v1:0' }}
          TRANSLATE_TO_KO: ${{ secrets.AWS_TRANSLATE_ENABLED || 'false' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: python scripts/fetch_aws_news.py

      - name: Check for changes
        id: changes
        run: |
          git status --porcelain
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/ services/ tags/ README.md
          COUNT=$(git diff --staged --name-only | grep -c '^news/' || true)
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "chore: AWS 뉴스 업데이트 ${DATE} (${COUNT}건 추가)"
          git push origin HEAD
